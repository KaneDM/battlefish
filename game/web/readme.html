<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Play</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { padding: 1.5rem 1rem 4rem; }
  .doc { max-width: 48rem; margin: 0 auto; }
  .doc h1 { font-size: 2rem; margin-bottom: 0.8rem; }
  .doc h2 { font-size: 1.4rem; margin: 2rem 0 0.6rem; padding-top: 0.4rem; }
  .doc h3 { font-size: 1.1rem; margin: 1.4rem 0 0.4rem; }
  .doc p, .doc li { max-width: 70ch; }
  .doc li { margin: 0.25rem 0; }
  .doc hr { border: none; border-top: 1px solid var(--line); margin: 2.5rem 0 0; }
  .doc code { background: var(--panel-2); padding: 0.1em 0.35em; border-radius: 0.3em; font-size: 0.92em; }
  .doc pre { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.8rem 1rem; overflow-x: auto; }
  .doc pre code { background: none; padding: 0; }
  .doc .table-scroll { overflow-x: auto; margin: 0.8rem 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  .doc th { text-align: left; color: var(--muted); font-weight: 600; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); }
  .doc td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc td:first-child { font-weight: 600; white-space: nowrap; }
  .top { display: flex; justify-content: flex-end; gap: 1rem; max-width: 48rem; margin: 0 auto 0.5rem; }
</style>
</head>
<body>
  <nav class="top"><a href="/editor">Editor</a><a href="/">Aquarium</a></nav>
  <main class="doc" id="doc"><p class="muted">Loading…</p></main>
  <script src="/static/readme.js"></script>
</body>
</html>
